name: 9R-Proxy 代理同步

on:
  schedule:
    # 北京时间 18:00 = UTC 10:00
    - cron: "0 */2 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🐍 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 📦 安装依赖
        run: |
          pip install requests[socks]==2.31.0
          pip install beautifulsoup4==4.12.0

      - name: 📥 抓取代理
        env:
          PROXY_USER: ${{ secrets.PROXY_USER }}
          PROXY_PASS: ${{ secrets.PROXY_PASS }}
          PROXY_OUTPUT: proxies.txt
        run: python fetch_proxies.py

      - name: 🔄 同步到 9router
        env:
          R9_BASE_URL: ${{ secrets.R9_BASE_URL }}
          R9_PASSWORD: ${{ secrets.R9_PASSWORD }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          PROXY_INPUT: proxies.txt
        run: python sync_9router.py

      - name: 🧹 清理旧的工作流运行记录
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 1 ]; then
              echo "删除运行记录: $run_id"
              gh run delete $run_id || true
            fi
          done 

      - uses: leung7963/gh-workflow-keepalive@main
