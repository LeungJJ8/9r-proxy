name: 9R-Proxy 代理同步

on:
  schedule:
    # 北京时间 18:00 = UTC 10:00
    - cron: "0 10 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🐍 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 📦 安装依赖
        run: pip install requests

      - name: 🔄 下载并同步代理池
        env:
          R9_BASE_URL: ${{ vars.R9_BASE_URL }}
          R9_PASSWORD: ${{ secrets.R9_PASSWORD }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python proxy-manager.py

      - name: 📄 提交 socks5-otc.txt
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if [ -f socks5-otc.txt ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add socks5-otc.txt
            if git diff --cached --quiet; then
              echo "⏭️ socks5-otc.txt 无变化，跳过提交"
            else
              git commit -m "🔄 chore: 更新 socks5-otc.txt $(date -u '+%Y-%m-%d')"
              git push
              echo "✅ 已提交并推送"
            fi
          else
            echo "⚠️ socks5-otc.txt 未生成"
          fi
